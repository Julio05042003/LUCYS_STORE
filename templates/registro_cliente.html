{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta.</title>
    <link rel="stylesheet" href="{% static 'css/registro.css' %}">
</head>

<body>

    <div class="container">

        <div class="card">

            <h2>Crear Cuenta</h2>

            <!-- 🔥 MENSAJES DJANGO -->
            {% if messages %}
            {% for message in messages %}
            <div class="alert">{{ message }}</div>
            {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <!-- ========================= -->
                <!-- DATOS PERSONALES -->
                <!-- ========================= -->
                <div class="section">
                    <h3>Datos Personales</h3>

                    <div class="grid-2">
                        <input type="text" name="nombre" placeholder="Nombre" required>
                        <input type="text" name="apellido" placeholder="Apellido" required>
                    </div>

                    <div class="grid-2">
                        <input type="text" name="identificacion" placeholder="Identificación" required>
                        <input type="email" name="email" placeholder="Correo" required>
                    </div>

                    <input type="password" name="password" placeholder="Contraseña" required minlength="6">
                </div>

                <!-- ========================= -->
                <!-- DIRECCIONES -->
                <!-- ========================= -->
                <div class="section">
                    <h3>Direcciones</h3>

                    <div id="direcciones">

                        <div class="direccion-item">

                            <div class="grid-3">

                                <select name="tipo_direccion[]" required>
                                    <option value="">Tipo Dirección</option>
                                    <option value="Casa">Casa</option>
                                    <option value="Trabajo">Trabajo</option>
                                    <option value="Entrega">Entrega</option>
                                </select>

                                <input type="text" name="pais[]" value="Nicaragua" readonly>

                                <select name="departamento[]" onchange="cargarMunicipios(this)" required>
                                    <option value="">Departamento</option>
                                </select>

                            </div>

                            <div class="grid-2">

                                <select name="ciudad[]" required>
                                    <option value="">Municipio</option>
                                </select>

                                <input type="text" name="detalle[]" placeholder="Dirección exacta" required>

                            </div>

                        </div>

                    </div>

                    <div class="acciones-direccion">

                        <button type="button" onclick="agregarDireccion()" class="btn-add">
                            + Agregar Dirección
                        </button>

                        <button type="button" class="btn-remove" onclick="eliminarDireccion()">
                            − Eliminar Dirección
                        </button>

                    </div>
                </div>

                <!-- ========================= -->
                <!-- TELÉFONOS -->
                <!-- ========================= -->
                <div class="section">
                    <h3>Teléfonos</h3>

                    <div id="telefonos">

                        <div class="telefono-item">

                            <div class="grid-4">

                                <input type="text" value="+505" readonly class="codigo-pais">

                                <input type="text" name="telefono[]" placeholder="Número" maxlength="8"
                                    pattern="[0-9]{8}" required>

                                <select name="operadora[]">
                                    <option value="">Operadora</option>
                                    <option value="Claro">Claro</option>
                                    <option value="Tigo">Tigo</option>
                                </select>

                                <select name="tipo_tel[]">
                                    <option value="">Tipo</option>
                                    <option value="Personal">Personal</option>
                                    <option value="Trabajo">Trabajo</option>
                                    <option value="Casa">Casa</option>
                                    <option value="WhatsApp">WhatsApp</option>
                                </select>

                            </div>

                        </div>

                    </div>

                    <div class="acciones-telefono">

                        <button type="button" onclick="agregarTelefono()" class="btn-add">
                            + Agregar Teléfono
                        </button>

                        <button type="button" class="btn-remove" onclick="eliminarTelefono()">
                            − Eliminar Teléfono
                        </button>

                    </div>
                </div>

                <!-- ========================= -->
                <!-- BOTÓN -->
                <!-- ========================= -->
                <button type="submit" class="btn-main">
                    Registrarse
                </button>



                <p class="login-link">
                    ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
                </p>

            </form>

        </div>
    </div>

    <script>

        function cargarDepartamentos() {

            document
                .querySelectorAll('select[name="departamento[]"]')
                .forEach(select => {

                    if (select.options.length > 1) return;

                    departamentos.forEach(dep => {

                        const option =
                            document.createElement('option');

                        option.value = dep;
                        option.textContent = dep;

                        select.appendChild(option);

                    });

                });
        }

        function cargarMunicipios(selectDepartamento) {

            const departamento =
                selectDepartamento.value;

            const municipioSelect =
                selectDepartamento
                    .closest('.direccion-item')
                    .querySelector('select[name="ciudad[]"]');

            municipioSelect.innerHTML =
                '<option value="">Municipio</option>';

            if (!municipios[departamento]) return;

            municipios[departamento].forEach(municipio => {

                const option =
                    document.createElement('option');

                option.value = municipio;
                option.textContent = municipio;

                municipioSelect.appendChild(option);

            });

        }



        document.addEventListener(
            'DOMContentLoaded',
            cargarDepartamentos
        );


        function agregarDireccion() {

            const container = document.getElementById('direcciones');

            const html = `
<div class="direccion-item">

    <div class="grid-3">

        <select name="tipo_direccion[]" required>
            <option value="">Tipo Dirección</option>
            <option value="Casa">Casa</option>
            <option value="Trabajo">Trabajo</option>
            <option value="Facturación">Facturación</option>
            <option value="Entrega">Entrega</option>
        </select>

        <input type="text"
               name="pais[]"
               value="Nicaragua"
               readonly>

        <select name="departamento[]"
                onchange="cargarMunicipios(this)"
                required>
            <option value="">Departamento</option>
        </select>

    </div>

    <div class="grid-2">

        <select name="ciudad[]" required>
            <option value="">Municipio</option>
        </select>

        <input type="text"
               name="detalle[]"
               placeholder="Dirección exacta"
               required>

    </div>

</div>
`;

            container.insertAdjacentHTML('beforeend', html);

            cargarDepartamentos();
        }

        function agregarTelefono() {

            const container = document.getElementById('telefonos');

            const html = `
<div class="telefono-item">

    <div class="grid-4">

        <input type="text"
               value="+505"
               readonly
               class="codigo-pais">

        <input type="text"
               name="telefono[]"
               placeholder="Número"
               maxlength="8"
               required>

        <select name="operadora[]">
            <option value="">Operadora</option>
            <option value="Claro">Claro</option>
            <option value="Tigo">Tigo</option>
        </select>

        <select name="tipo_tel[]">
            <option value="">Tipo</option>
            <option value="Personal">Personal</option>
            <option value="Trabajo">Trabajo</option>
            <option value="Casa">Casa</option>
            <option value="WhatsApp">WhatsApp</option>
        </select>

    </div>

</div>
`;

            container.insertAdjacentHTML('beforeend', html);

            aplicarValidacionTelefonos();
        }

        function aplicarValidacionTelefonos() {

            document.querySelectorAll('input[name="telefono[]"]').forEach(input => {

                if (input.dataset.validado) return;

                input.dataset.validado = "true";

                input.addEventListener('input', function () {

                    this.value = this.value.replace(/\D/g, '');

                    if (this.value.length === 8) {

                        this.classList.add('telefono-correcto');

                        setTimeout(() => {
                            this.classList.remove('telefono-correcto');
                        }, 1000);
                    }

                });

            });

        }


        function eliminarDireccion() {

            const direcciones =
                document.querySelectorAll('.direccion-item');

            if (direcciones.length === 1) {

                alert(
                    'Debe existir al menos una dirección.'
                );

                return;
            }

            direcciones[direcciones.length - 1].remove();

        }

        function eliminarTelefono() {

            const telefonos =
                document.querySelectorAll('.telefono-item');

            if (telefonos.length === 1) {

                alert(
                    'Debe existir al menos un teléfono.'
                );

                return;
            }

            telefonos[telefonos.length - 1].remove();

        }


        document.addEventListener(
            'DOMContentLoaded',
            aplicarValidacionTelefonos
        );
    </script>

</body>

</html>
