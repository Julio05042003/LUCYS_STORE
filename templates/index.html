<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Animaciones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        body {
            background: #f5f5f5;
        }

        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            height: 220px;
            object-fit: cover;
        }

        .precio {
            color: #28a745;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .titulo {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4 animate__animated animate__fadeInDown">
        🛍️ Catálogo de Productos
    </h2>

    <div class="row">
        {% for producto in productos %}
        <div class="col-md-3 mb-4 animate__animated animate__zoomIn">
            <div class="card shadow">

                {% if producto.imagen %}
                    <img src="{{ producto.imagen.url }}" class="card-img-top">
                {% else %}
                    <img src="https://via.placeholder.com/300x200" class="card-img-top">
                {% endif %}

                <div class="card-body text-center">
                    <h5 class="titulo">{{ producto.nombre }}</h5>
                    <p>{{ producto.descripcion }}</p>
                    <p class="precio">C$ {{ producto.precio_c }}</p>

                    <button class="btn btn-dark w-100">
                        Ver producto
                    </button>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>

</div>

</body>
</html>
